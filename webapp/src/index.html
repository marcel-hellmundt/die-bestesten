<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DieBestesten</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/png" href="img/logos/die-bestesten.png" />
    <link rel="apple-touch-icon" href="img/logos/die-bestesten.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DieBestesten" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Theme vor dem App-Start setzen (kein kurzes Aufblitzen von Light) — Logik wie core/theme.service.ts -->
    <script>
      try {
        var pref = localStorage.getItem('theme');
        if (pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#181b21');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

@if (isMaintainer() || isContributor()) {
  <h1 class="page-title">Data Management</h1>
  @if (isMaintainer()) {
    <p class="page-subtitle">Spieler, Clubs, Spielklassen und Saisons verwalten</p>
  }

  <!-- Standard-Sub-Menü (bleibt auf Desktop beim Scrollen unter der Topbar gepinnt) -->
  <nav class="pill-nav pill-nav--sticky pill-nav--last" appStuck>
    <a class="pill" routerLink="ratings" routerLinkActive="pill--active">Punkte eintragen</a>
    @if (isMaintainer()) {
      <span class="nav-separator" aria-hidden="true"></span>
      <a class="pill" routerLink="player" routerLinkActive="pill--active">Spieler</a>
      <a class="pill" routerLink="club" routerLinkActive="pill--active">Clubs</a>
      <a class="pill" routerLink="season" routerLinkActive="pill--active">Saisons</a>
      <a class="pill" routerLink="division" routerLinkActive="pill--active">Spielklassen</a>
      <a class="pill" routerLink="country" routerLinkActive="pill--active">Länder</a>
      <span class="nav-spacer" aria-hidden="true"></span>
      <a class="pill" routerLink="league" routerLinkActive="pill--active">Ligen</a>
      @if (isAdmin()) {
        <a class="pill" routerLink="manager" routerLinkActive="pill--active">Manager</a>
        <a class="pill" routerLink="achievements" routerLinkActive="pill--active">Achievements</a>
        <a class="pill" routerLink="session-heatmap" routerLinkActive="pill--active">Nutzung</a>
      }
    }
  </nav>
}

<router-outlet></router-outlet>

<section class="settings-section">
  <div class="section-header-row"><h2 class="section-header">Erscheinung</h2></div>
  <p class="section-desc">Gilt nur für dieses Gerät.</p>

  <div class="theme-switch" role="radiogroup" aria-label="Erscheinungsbild">
    @for (opt of options; track opt.value) {
      <button type="button"
              class="theme-switch__option"
              role="radio"
              [class.theme-switch__option--active]="themeSvc.preference() === opt.value"
              [attr.aria-checked]="themeSvc.preference() === opt.value"
              (click)="themeSvc.setPreference(opt.value)">
        <app-icon [name]="opt.icon" />
        {{ opt.label }}
      </button>
    }
  </div>

  @if (themeSvc.preference() === 'system') {
    <p class="theme-hint">Dein Gerät nutzt gerade: {{ themeSvc.systemTheme() === 'dark' ? 'Dunkel' : 'Hell' }}</p>
  }
</section>

<section class="settings-section">
  <div class="section-header-row"><h2 class="section-header">Benachrichtigungen</h2></div>

  <div class="pref-list">
    @for (row of notificationRows(); track row.key) {
      <ng-container *ngTemplateOutlet="prefRow; context: { $implicit: row }" />
    }
  </div>
</section>

<!-- Einblendungen: große Hinweise direkt über der Seite -->
<section class="settings-section">
  <div class="section-header-row"><h2 class="section-header">Einblendungen</h2></div>
  <p class="section-desc">Große Hinweise, die direkt über der Seite erscheinen. Ausgeschaltet findest du alles trotzdem an seinem Platz.</p>

  <div class="pref-list">
    @for (row of overlayRows(); track row.key) {
      <ng-container *ngTemplateOutlet="prefRow; context: { $implicit: row }" />
    }
  </div>
</section>

<ng-template #prefRow let-row>
  <label class="pref-item">
    <span class="pref-icon"><app-icon [name]="row.icon" /></span>
    <div class="pref-text">
      <span class="pref-name">{{ row.name }}</span>
      <span class="pref-desc">{{ row.desc }}</span>
    </div>
    <span class="toggle">
      <input type="checkbox"
             class="toggle__input"
             [checked]="pref(row.key)"
             (click)="$event.stopPropagation()"
             (change)="setPreference(row.key, $any($event.target).checked)" />
      <span class="toggle__track"></span>
    </span>
  </label>
</ng-template>

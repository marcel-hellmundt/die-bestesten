<div class="backdrop" (click)="phase() !== 'tearing' && closed.emit()">
  <div class="panel" (click)="$event.stopPropagation()">
    @if (heading()) { <h2 class="panel__title">{{ heading() }}</h2> }

    @if (error()) {
      <p class="error">{{ error() }}</p>
      <div class="actions">
        <button class="btn btn-ghost" type="button" (click)="closed.emit()">Schließen</button>
      </div>
    } @else if (phase() !== 'revealed') {
      <!-- Geschlossenes Folien-Pack: Lasche oben (reißt ab), Körper vorne, Karten verdeckt dahinter -->
      <button type="button" class="pack pack--{{ pack().source }}" [class.pack--tearing]="phase() === 'tearing'"
              (click)="onTear()" [style.--n]="pack().size" aria-label="Pack aufreißen">
        <span class="pack__cards" aria-hidden="true">
          @for (i of backs(); track i) {
            <span class="back" [style.--i]="i">
              <span class="back__mark">DK</span>
            </span>
          }
        </span>
        <span class="pack__body">
          <span class="pack__brand">Die Klebrigsten</span>
          <span class="pack__kind">{{ face().kind }}</span>
          <span class="pack__headline">{{ face().headline }}</span>
          <span class="pack__count">{{ pack().size }} Sticker</span>
          @if (pack().leagueName) { <span class="pack__league">{{ pack().leagueName }}</span> }
        </span>
        <span class="pack__top"></span>
      </button>

      <div class="sealed-actions" [class.sealed-actions--hidden]="phase() === 'tearing'">
        <p class="hint">Tippen zum Aufreißen</p>
        <button class="btn btn-ghost btn-sm" type="button" (click)="closed.emit()">Später öffnen</button>
      </div>
    } @else {
      <div class="cards">
        @for (c of cards(); track $index) {
          <button class="pull" type="button" [style.animation-delay.ms]="$index * 380" (click)="open.emit(c)"
                  [attr.aria-label]="c.sticker.displayname">
            <app-sticker-card [data]="c.card" />
            <span class="tag" [class.tag--new]="c.isNew">{{ c.isNew ? 'Neu' : 'Doppelt ×' + c.count }}</span>
          </button>
        }
      </div>
      <div class="actions">
        @if (remaining() > 0) {
          <button class="btn btn-primary" type="button" [disabled]="busy()" (click)="next.emit()">
            Nächstes Pack ({{ remaining() }})
          </button>
        }
        <button class="btn btn-ghost" type="button" (click)="closed.emit()">Fertig</button>
      </div>
    }
  </div>
</div>

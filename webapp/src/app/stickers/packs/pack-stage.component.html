@if (opener.visible()) {
  <app-pack-open-dialog [inline]="true" [compactAfter]="99" [heading]="title()"
                        [artBlend]="artBlend()" [artOpacity]="artOpacity()" [artShine]="artShine()" [artFade]="artFade()"
                        [pack]="opener.info()" [choices]="opener.choices()" [choosing]="opener.choosing()"
                        [cards]="opener.cards()" [error]="opener.error()"
                        [remaining]="opener.remaining()" [busy]="opener.busy()" [covered]="openCard() !== null"
                        (pick)="pick($event)" (back)="opener.backToChoice()"
                        (tear)="opener.tear()" (next)="reset()" (open)="openPulled($event)" (closed)="reset()" />
}

@if (openCard(); as card) {
  <app-sticker-card-dialog [data]="card" (closed)="openCard.set(null)" />
}

@let d = data();
<!-- Neigung als CSS-Variablen: steuern Glanzlicht und (bei shiny) das Holo -->
<div class="card-3d" [class.card-3d--interactive]="interactive()"
     [style.transform]="interactive() ? 'perspective(900px) rotateX(' + rotateX() + 'deg) rotateY(' + rotateY() + 'deg)' : null"
     [style.--mx]="glareX() + '%'"
     [style.--my]="glareY() + '%'"
     [style.--posx]="posX() + '%'"
     [style.--posy]="posY() + '%'"
     [style.--hyp]="fromCenter()"
     [style.--o]="interactive() ? 1 : null"
     [style.--fx]="interactive() ? (tiltX() < 0 ? -tiltX() : tiltX()) : null"
     [style.--fy]="interactive() ? (tiltY() < 0 ? -tiltY() : tiltY()) : null"
     [style.--invx]="tiltX() < 0 ? 1 : 0"
     [style.--invy]="tiltY() < 0 ? 1 : 0"
     [style.--facets-base]="facetUrls.base"
     [style.--facets-x]="facetUrls.x"
     [style.--facets-y]="facetUrls.y">
  <div class="sticker-card sticker-card--{{ d.tier }}" [class.sticker-card--shiny]="d.shiny"
       [style.--club-primary]="d.clubPrimaryColor || null"
       [style.--club-secondary]="d.clubSecondaryColor || d.clubPrimaryColor || null">
    <div class="sticker-card__inner">
      <!-- Optionales Hintergrundbild (geblurrt), liegt ganz hinten und wird vom Shine überlagert -->
      @if (backgroundUrl(); as bg) {
        <img draggable="false" class="sticker-card__bg" [src]="bg" alt="" (error)="onBackgroundError()" />
      }

      <!-- Vereinslogo oben links, hinter dem Spielerfoto -->
      @if (d.clubLogoUrl && !logoFailed()) {
        <img draggable="false" class="sticker-card__club" [src]="d.clubLogoUrl" [alt]="d.clubName ?? ''" (error)="logoFailed.set(true)" />
      }

      @if (d.shiny) {
        <!-- Facetten-Licht: unregelmäßige Voronoi-Facetten mit zufälligen Normalen — je nach
             Neigungsrichtung hellen andere Zellen auf (X- und Y-Anteil als eigene Ebene) -->
        <div class="sticker-card__facets sticker-card__facets--x"></div>
        <div class="sticker-card__facets sticker-card__facets--y"></div>
        <!-- Shine ("rare ultra"-Prinzip): Facetten-Textur + Regenbogen + Folienstreifen über Hintergrund
             + Logo (color-dodge), zweite Ebene (::after) läuft gegenläufig → Parallaxe/Tiefe.
             Das Spielerfoto liegt darüber und ist vom Effekt ausgenommen. -->
        <div class="sticker-card__shine"></div>
      }

      @if (d.photoUrl && !photoFailed()) {
        <img draggable="false" class="sticker-card__photo" [src]="d.photoUrl" [alt]="d.displayname" (error)="photoFailed.set(true)" />
      } @else {
        <img draggable="false" class="sticker-card__photo sticker-card__photo--placeholder" src="img/placeholders/player.png" alt="" />
      }

      <!-- Namens-Banner unten links: schräg angeschnittenes weißes Band, Vorname klein, Name groß -->
      <div class="sticker-card__banner">
        <div class="sticker-card__banner-bg"></div>
        <div class="sticker-card__banner-text">
          @if (firstLine(); as first) { <span class="sticker-card__first">{{ first }}</span> }
          <span class="sticker-card__last" [style.font-size]="mainSize() + 'cqw'">{{ mainLine() }}</span>
        </div>
      </div>

      <!-- Seltenheit oben rechts: kleines Band im Stil des Namens-Banners (gespiegelt) -->
      <div class="sticker-card__tier">
        <div class="sticker-card__tier-bg"></div>
        <span class="sticker-card__tier-text">{{ tierLabel[d.tier] }}@if (d.shiny) { · Shiny }</span>
      </div>

      @if (interactive()) {
        <div class="sticker-card__glare"></div>
      }
    </div>
  </div>
</div>

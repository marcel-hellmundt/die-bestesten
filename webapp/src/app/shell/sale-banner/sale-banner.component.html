@if (visible() && sale(); as s) {
  <div class="sale-backdrop" (click)="dismiss()">
    <section class="sale" role="dialog" aria-modal="true" aria-labelledby="sale-title" (click)="$event.stopPropagation()">
      <button type="button" class="sale__close" (click)="dismiss()" aria-label="Schließen">✕</button>

      <span class="sale__moon" aria-hidden="true">🌙</span>
      <h2 class="sale__title" id="sale-title">PEITSCHIG</h2>
      <p class="sale__lead">Nachtrabatt im Sticker-Shop – nur jetzt!</p>

      <div class="sale__deals">
        <div class="deal deal--lukaten">
          <b class="deal__pct">−{{ s.lukaten_pct }} %</b>
          <span class="deal__label">auf Lukaten-Preise</span>
        </div>
        <div class="deal deal--eur">
          <b class="deal__pct">−{{ s.eur_pct }} %</b>
          <span class="deal__label">auf Euro-Preise</span>
        </div>
      </div>

      <div class="sale__timer">
        <span class="sale__timer-label">Nur noch</span>
        <app-sale-countdown class="sale__timer-value" [until]="s.ends_at" />
      </div>

      <button type="button" class="sale__cta" (click)="goShop()">Ab in den Shop</button>
      <button type="button" class="sale__later" (click)="dismiss()">Nee, lass mal</button>
    </section>
  </div>
}
